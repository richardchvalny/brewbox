# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.2.1 && git push origin v0.2.1
#
# The tag must match CFBundleShortVersionString in Support/Info.plist, since
# AppUpdater rejects a Brewbox.zip whose version differs from the release's.
# Builds are unsigned for now (UNSIGNED=1, see scripts/release.sh).
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # bundle.sh uses the commit count as the build number.
          fetch-depth: 0

      - name: Check the tag matches Info.plist
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION in Support/Info.plist"
              exit 1
          fi

      - name: Build Brewbox.dmg and Brewbox.zip
        run: UNSIGNED=1 ./scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Brewbox.dmg build/Brewbox.zip \
              --title "Brewbox ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
